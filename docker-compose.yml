services:
  db:
    image: timescale/timescaledb:latest-pg16
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_USER: stocker
      POSTGRES_PASSWORD: stocker
      POSTGRES_DB: stocker
    ports:
      - "5432:5432"
    volumes:
      - stocker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocker -d stocker"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      STOCKER_DB_URL: postgresql+psycopg://stocker:stocker@db:5432/stocker
      STOCKER_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    env_file:
      - .env
    build: .
    command: streamlit run stocker/web/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      STOCKER_DB_URL: postgresql+psycopg://stocker:stocker@db:5432/stocker
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: python -m stocker.report schedule
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STOCKER_DB_URL: postgresql+psycopg://stocker:stocker@db:5432/stocker
      STOCKER_DATA_DIR: /app/data
      TZ: Asia/Seoul
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed:ro  # 이미지에는 seed/가 없다 (semi·events 수집용)
    depends_on:
      db:
        condition: service_healthy

volumes:
  stocker_pgdata:
