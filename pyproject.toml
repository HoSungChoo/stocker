[project]
name = "stocker"
version = "0.0.1"
description = "SOXL 3x leveraged ETF 시뮬레이션 및 데이터 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "fredapi",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pydantic-settings",
    "typer",
    "python-dotenv",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stocker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not db'"
markers = [
    "network: 인터넷 연결이 필요한 테스트",
    "db: 실행 중인 PostgreSQL/TimescaleDB가 필요한 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# typer의 Option()/Argument() 기본값 관용구 허용
ignore = ["B008", "UP042"]
